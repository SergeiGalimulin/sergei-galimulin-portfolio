<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner sign in — SergeiGalimulin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=block">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-base="../">
  <header class="nav">
    <nav class="nav-bar" aria-label="Main">
      <a class="logo" href="../index.html" aria-label="SergeiGalimulin — home"><i>Sergei</i><b>Galimulin</b></a>
      <div class="nav-links">
        <a class="nav-link nav-home" href="../index.html">Home</a>
        <a class="nav-link" href="../portfolio.html">Portfolio</a>
        <a class="nav-link is-active" href="login.html" aria-current="page">Admin</a>
      </div>
    </nav>
  </header>

  <main class="login">
    <div class="login-card">
      <div>
        <p class="eyebrow">Admin</p>
        <h1 id="heading">Owner sign in</h1>
        <p style="margin:0;font-size:15px;line-height:1.5;color:var(--muted)">Only the portfolio owner can manage projects.</p>
      </div>
      <form id="form" novalidate style="display:flex;flex-direction:column;gap:18px">
        <div class="field">
          <label class="label" for="email">Email</label>
          <input class="input" id="email" type="email" autocomplete="email" aria-describedby="email-err">
          <p class="err" id="email-err" hidden></p>
        </div>
        <div class="field">
          <label class="label" for="password">Password</label>
          <div class="input-wrap">
            <input class="input" id="password" type="password" autocomplete="current-password" aria-describedby="pass-err">
            <button class="eye" id="eye" type="button" aria-label="Show password" aria-pressed="false"></button>
          </div>
          <p class="err" id="pass-err" hidden></p>
        </div>
        <button class="btn btn-primary" id="submit" type="submit" style="margin-top:8px;width:100%">Sign in</button>
        <p class="notice" id="notice" role="status" hidden></p>
      </form>
      <button class="text-btn" id="mode" type="button" style="align-self:center">First time? Create the owner account</button>
    </div>
  </main>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/admin-login.js"></script>
</body>
</html>
