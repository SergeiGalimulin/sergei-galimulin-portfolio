<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — SergeiGalimulin</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <script>try { if (!localStorage.getItem('sg.session')) location.replace('login.html'); } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=block">
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body data-base="../">
  <header class="nav">
    <nav class="nav-bar" aria-label="Admin">
      <div style="display:flex;align-items:center;gap:12px">
        <a class="logo" href="../index.html" aria-label="SergeiGalimulin — public site"><i>Sergei</i><b>Galimulin</b></a>
        <span class="badge mono">ADMIN</span>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="../portfolio.html">View site</a>
        <button class="nav-link text-btn" type="button" data-act="signout">Sign out</button>
      </div>
    </nav>
  </header>

  <main class="wrap admin-main">
    <div class="admin-head">
      <div>
        <p class="eyebrow">Dashboard</p>
        <h1>Your portfolio</h1>
        <p class="mono" id="summary" style="margin:0;font-size:13px;color:var(--muted)"></p>
      </div>
      <a class="btn btn-primary btn-md" href="edit.html"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>New project</a>
    </div>
    <div id="list"></div>
    <div style="margin-top:24px;display:flex;justify-content:flex-end">
      <button class="text-btn" type="button" data-act="reset" style="font-size:13px;color:var(--subtle)">Reset demo data</button>
    </div>
  </main>

  <div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="del-title" aria-describedby="del-desc" hidden>
    <button class="modal-bg" type="button" tabindex="-1" aria-label="Cancel" data-act="cancel"></button>
    <div class="modal-card">
      <h2 id="del-title"></h2>
      <p id="del-desc">All its images and videos will be removed permanently.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost btn-md" type="button" data-act="cancel" id="cancel">Cancel</button>
        <button class="btn btn-danger btn-md" type="button" data-act="confirm">Delete project</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="../assets/js/site.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
